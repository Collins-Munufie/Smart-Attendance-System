version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smartsas_db
    restart: always
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpassword
      POSTGRES_DB: smartattendance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: smartsas_cache
    restart: always
    ports:
      - "6379:6379"

  ml_service:
    build: ./ml_service
    container_name: smartsas_ml
    restart: always
    ports:
      - "8001:8001"
    environment:
      - ML_ML_ENGINE_MODE=fallback
    volumes:
      - ml_data:/app/data

  backend:
    build: ./backend
    container_name: smartsas_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=smartuser
      - POSTGRES_PASSWORD=smartpassword
      - POSTGRES_DB=smartattendance
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://cache:6379/0
      - ML_SERVICE_URL=http://ml_service:8001
    depends_on:
      - db
      - cache
      - ml_service

  frontend:
    build: ./frontend
    container_name: smartsas_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  ml_data:
